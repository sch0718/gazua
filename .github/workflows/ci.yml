name: CI

on:
  push:
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test
      - run: pnpm test:demo
      - run: pnpm build
      # proxy 패키지는 Task 8에서 추가됩니다. 그 전까지는 이 단계가 실패할 수 있어요.
      - run: pnpm --filter proxy test
