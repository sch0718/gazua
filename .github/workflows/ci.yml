name: CI

on:
  push:
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm check:e2e
      - run: pnpm test
      - run: pnpm test:demo
      - run: pnpm test:universe
      - name: 유니버스 주 키 계산
        id: week
        run: echo "key=$(date -u +%G-W%V)" >> "$GITHUB_OUTPUT"
      - name: 유니버스 캐시
        id: universe
        uses: actions/cache@v4
        with:
          path: public/universe.json
          key: universe-${{ steps.week.outputs.key }}
          restore-keys: universe-
      - run: pnpm build
        env:
          UNIVERSE_REUSE: ${{ steps.universe.outputs.cache-hit }}
      - run: pnpm --filter proxy test

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: 유니버스 주 키 계산
        id: week
        run: echo "key=$(date -u +%G-W%V)" >> "$GITHUB_OUTPUT"
      - name: 유니버스 캐시
        id: universe
        uses: actions/cache@v4
        with:
          path: public/universe.json
          key: universe-${{ steps.week.outputs.key }}
          restore-keys: universe-
      - name: Playwright 브라우저 캐시
        id: pw
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-1.63.0
      - if: steps.pw.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium
      - if: steps.pw.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium
      - run: pnpm e2e
        env:
          UNIVERSE_REUSE: ${{ steps.universe.outputs.cache-hit }}
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-failure
          path: |
            test-results/
            playwright-report/
          retention-days: 7
