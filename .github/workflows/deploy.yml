name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # UTC 21:00 일~목 = KST 06:00 월~금. 평일 아침마다 종목 유니버스를 새로 받아 다시 배포한다.
    - cron: '0 21 * * 0-4'

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # 공용 패키지(@sch0718/*)를 GitHub Packages에서 받으려면 packages: read가 필요하다(.npmrc).
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      # pnpm은 프로젝트 .npmrc의 인증 줄에서 환경변수를 풀지 않는다. 인증은 사용자 ~/.npmrc에 둔다(docs/development.md).
      - run: echo '//npm.pkg.github.com/:_authToken=${GITHUB_PACKAGES_TOKEN}' >> ~/.npmrc
      - run: pnpm install --frozen-lockfile
        env:
          GITHUB_PACKAGES_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # prebuild 단계가 종목 유니버스(public/universe.json)를 내려받는다.
      # 동기화·공유 설정은 저장소 Actions Variables에서 온다. 비어 있으면 기능이 꺼진 채로 빌드된다(sync-worker/README.md).
      - run: pnpm build
        env:
          VITE_SYNC_API_URL: ${{ vars.VITE_SYNC_API_URL }}
          VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}
          # 카카오톡 공유(선택). 앱 번들에 들어가는 공개 키라 Variables에 둔다. 비면 링크 복사만 보인다.
          VITE_KAKAO_JS_KEY: ${{ vars.VITE_KAKAO_JS_KEY }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
