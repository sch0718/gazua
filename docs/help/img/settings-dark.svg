text{font-family:'Pretendard Variable', Pretendard, -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif}
.sc{opacity:0;animation:scene 15.2s linear infinite backwards}
.rise{transform-box:fill-box;animation:rise 15.2s cubic-bezier(.2,.8,.2,1) infinite backwards}
.pop{transform-box:fill-box;transform-origin:center;animation:pop 15.2s ease-out infinite backwards}
.draw{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 15.2s ease-out infinite backwards}
.fade{opacity:0;animation:fade 15.2s linear infinite backwards}
.tap{transform-box:fill-box;transform-origin:center;opacity:0;animation:tap 15.2s ease-out infinite backwards}
@keyframes scene{0%{opacity:0}2.303%{opacity:1}22.697%{opacity:1}25.000%{opacity:0}100%{opacity:0}}
@keyframes rise{0%{opacity:0;transform:translateY(14px)}2.961%{opacity:1;transform:none}100%{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(0)}1.974%{transform:scale(1.15)}2.961%{transform:scale(1)}100%{transform:scale(1)}}
@keyframes draw{0%{stroke-dashoffset:1}7.895%{stroke-dashoffset:0}100%{stroke-dashoffset:0}}
@keyframes fade{0%{opacity:0}1.974%{opacity:1}100%{opacity:1}}
@keyframes tap{0%{opacity:0;transform:scale(.4)}0.789%{opacity:1;transform:scale(1)}4.605%{opacity:0;transform:scale(1.9)}100%{opacity:0;transform:scale(1.9)}}
@media (prefers-reduced-motion:reduce){
*{animation:none!important}
.s0{opacity:1}
.rise,.fade{opacity:1;transform:none}
.pop{transform:none}
.draw{stroke-dasharray:none;stroke-dashoffset:0}
}</style>
