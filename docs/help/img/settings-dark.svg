<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" role="img" aria-labelledby="motion-title motion-desc">
<title id="motion-title">가즈아 도움말 — 설정과 연결</title>
<desc id="motion-desc">설정과 연결 사용법: 1. 공급자 고르기(한국투자증권(KIS)·토스증권·데모 데이터 중에서) 2. 프록시와 키 넣기(프록시 URL·토큰과 App Key·App Secret) 3. 연결 진단(프록시 → CORS → 토큰 → 시세 순서로 확인해요) 4. 키 잠그기(켜면 앱을 열 때마다 암호를 물어요)</desc>
