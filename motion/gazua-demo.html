<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>가즈아 모션 데모</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
/* ===== 토큰 (스펙 8.2·8.3) ===== */
:root{
  color-scheme: light;
  --bg:#f6f7f9; --surface:#ffffff; --surface2:#f0f1f4; --line:#e3e5e9;
  --t1:#111317; --t2:#5b6069; --t3:#8a9099;
  --accent:#5b47e0; --accent-soft:rgba(91,71,224,.10); --on-accent:#fff;
  --up:#e02e3c; --down:#1d5fd6; --ok:#0ca30c; --warn:#b77900; --err:#d03b3b;
  --band:rgba(17,19,23,.045); --hatch:rgba(17,19,23,.24); --grid:rgba(17,19,23,.07);
  --scrim:rgba(17,19,23,.38); --shadow:0 10px 40px rgba(17,19,23,.18);
  --s1:#eb6834; --s2:#1baf7a; --s3:#4a3aa7; --s4:#eda100; --s5:#e87ba4; --s6:#008300; --s7:#2a78d6; --s8:#e34948;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --bg:#0e0f11; --surface:#17181b; --surface2:#1f2125; --line:#2a2d33;
    --t1:#f2f3f5; --t2:#a4a8b0; --t3:#6d727b;
    --accent:#8b7bff; --accent-soft:rgba(139,123,255,.14); --on-accent:#0e0f11;
    --up:#ff5a5f; --down:#4c8dff; --ok:#3ccf5a; --warn:#fab219; --err:#ff6b6b;
    --band:rgba(255,255,255,.045); --hatch:rgba(255,255,255,.24); --grid:rgba(255,255,255,.07);
    --scrim:rgba(0,0,0,.55); --shadow:0 10px 40px rgba(0,0,0,.5);
    --s1:#d95926; --s2:#199e70; --s3:#9085e9; --s4:#c98500; --s5:#d55181; --s6:#008300; --s7:#3987e5; --s8:#e66767;
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --bg:#0e0f11; --surface:#17181b; --surface2:#1f2125; --line:#2a2d33;
  --t1:#f2f3f5; --t2:#a4a8b0; --t3:#6d727b;
  --accent:#8b7bff; --accent-soft:rgba(139,123,255,.14); --on-accent:#0e0f11;
  --up:#ff5a5f; --down:#4c8dff; --ok:#3ccf5a; --warn:#fab219; --err:#ff6b6b;
  --band:rgba(255,255,255,.045); --hatch:rgba(255,255,255,.24); --grid:rgba(255,255,255,.07);
  --scrim:rgba(0,0,0,.55); --shadow:0 10px 40px rgba(0,0,0,.5);
  --s1:#d95926; --s2:#199e70; --s3:#9085e9; --s4:#c98500; --s5:#d55181; --s6:#008300; --s7:#3987e5; --s8:#e66767;
}
:root.global-colors{ --up:#0ca30c; --down:#d03b3b; }

*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--t1)}
body{font-family:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;padding-bottom:84px}
button,input{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible,input:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
.num{font-variant-numeric:tabular-nums}
.up{color:var(--up)} .down{color:var(--down)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ===== 레이아웃 ===== */
.poc-banner{font-size:12px;color:var(--t2);background:var(--surface2);text-align:center;padding:6px 12px}
.app{display:grid;grid-template-columns:minmax(0,1fr);grid-template-areas:"bar" "head" "chart" "controls" "side";max-width:1600px;margin:0 auto}
.rail{grid-area:rail;display:none}
.bar{grid-area:bar} .head{grid-area:head} .chartbox{grid-area:chart} .controls{grid-area:controls} .side{grid-area:side}
@media (min-width:600px) and (orientation:landscape), (min-width:900px){
  .app{grid-template-columns:minmax(0,2fr) minmax(300px,1fr);grid-template-areas:"bar bar" "controls side" "head side" "chart side";grid-template-rows:auto auto auto 1fr}
  .side{border-left:1px solid var(--line);background:var(--surface);min-height:100%}
  .controls{flex-direction:row!important;flex-wrap:wrap;align-items:center}
}
@media (min-width:1024px){
  body{padding-bottom:0}
  .app{grid-template-columns:240px minmax(0,1fr) 340px;grid-template-areas:"rail bar side" "rail controls side" "rail head side" "rail chart side";height:calc(100vh - 29px)}
  .rail{display:flex}
  .side{overflow:auto}
  .bar .tabs{display:none}
}

/* 앱 바 */
.bar{display:flex;align-items:center;gap:8px;padding:8px 16px;min-height:56px}
.tabs{display:flex;gap:2px;overflow-x:auto;flex:1;min-width:0;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{font-size:18px;font-weight:700;color:var(--t3);padding:8px 8px;white-space:nowrap;letter-spacing:-.01em;min-height:44px}
.tab.on{color:var(--t1)}
.spacer{flex:1}
.chip-status{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;padding:7px 11px;border-radius:999px;background:var(--surface2);white-space:nowrap;min-height:34px}
.dot-live{width:7px;height:7px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 3px color-mix(in srgb,var(--ok) 22%,transparent)}
.dot-off{width:7px;height:7px;border-radius:50%;background:var(--t3)}
.icon-btn{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;color:var(--t2)}
.icon-btn:hover{background:var(--surface2)}

/* 레일 (PC) */
.rail{flex-direction:column;gap:2px;padding:14px 10px;border-right:1px solid var(--line);background:var(--surface);overflow:auto}
.brand{font-weight:800;font-size:19px;padding:4px 10px 14px;letter-spacing:-.02em;display:flex;align-items:center;gap:8px}
.brand i{width:24px;height:24px;border-radius:8px;background:linear-gradient(135deg,var(--s1),var(--s3));display:block}
.ritem{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:10px;font-size:14px;color:var(--t2);text-align:left;width:100%}
.ritem:hover{background:var(--surface2)}
.ritem.on{background:var(--surface2);color:var(--t1);font-weight:700}
.ritem em{margin-left:auto;font-style:normal;font-size:12px;color:var(--t3)}
.rlabel{font-size:11px;font-weight:700;color:var(--t3);padding:14px 10px 4px;letter-spacing:.04em}
.kbd{font-size:11px;color:var(--t3);border:1px solid var(--line);border-radius:5px;padding:0 5px;font-weight:500;margin-left:auto}

/* 헤드라인 */
.head{padding:2px 16px 0}
.head .k{font-size:13px;color:var(--t2)}
.head .fresh{font-size:12.5px;color:var(--t2);display:flex;align-items:center;gap:6px;margin-top:2px}
@media (min-width:600px){.head{padding:6px 24px 0}.bar{padding:8px 24px}}

/* 차트 */
.chartbox{padding:6px 0 0 16px;position:relative;min-width:0}
@media (min-width:600px){.chartbox{padding:6px 12px 0 24px}}
#chart{width:100%;touch-action:pan-y;user-select:none;-webkit-user-select:none}
#chart svg{display:block;overflow:visible}
.legend{display:flex;gap:14px;flex-wrap:wrap;padding:4px 0 2px;font-size:11.5px;color:var(--t3)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.sw{width:14px;height:8px;border-radius:2px;display:inline-block}
.sw.hatch{background:repeating-linear-gradient(135deg,var(--hatch) 0 1.5px,transparent 1.5px 4px);outline:1px solid var(--line)}
.sw.auction{background:repeating-linear-gradient(90deg,var(--hatch) 0 1px,transparent 1px 3px);outline:1px solid var(--line)}
.sw.dotted{height:0;border-top:2px dotted var(--t3);border-radius:0;width:16px}
.empty{padding:48px 16px 40px;text-align:center}
.empty b{font-size:18px;display:block;margin-bottom:6px}
.empty p{color:var(--t2);font-size:14px;margin-bottom:18px}
.empty .row{justify-content:center}

/* 컨트롤 */
.controls{display:flex;flex-direction:column;gap:8px;padding:10px 16px 8px}
@media (min-width:600px){.controls{padding:10px 24px 4px}}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.seg{display:inline-flex;background:var(--surface2);border-radius:12px;padding:3px;gap:2px}
.seg button{padding:6px 13px;border-radius:9px;font-size:14px;font-weight:700;color:var(--t2);min-height:38px;min-width:44px;line-height:1.1}
.seg button.on{background:var(--surface);color:var(--t1);box-shadow:0 1px 2px rgba(0,0,0,.14)}
.seg button[aria-disabled="true"]{color:var(--t3);opacity:.5;cursor:not-allowed}
.seg button small{display:block;font-size:10px;font-weight:600;color:var(--accent)}
.seg.wide{display:flex;width:100%} .seg.wide button{flex:1}
@media (min-width:600px){.seg.wide{display:inline-flex;width:auto}.seg.wide button{flex:none}}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{padding:7px 13px;border-radius:999px;font-size:13.5px;font-weight:700;background:var(--surface2);color:var(--t2);white-space:nowrap;min-height:36px}
.chip.on{background:var(--t1);color:var(--bg)}
.chip.metric{background:var(--accent-soft);color:var(--accent)}
.chip.metric::after{content:" ▾";font-size:10px}
.note{font-size:12px;color:var(--t2)}

/* 리더보드 */
.side{padding:4px 8px 16px;min-width:0}
.board-head{display:flex;align-items:center;justify-content:space-between;padding:10px 8px 4px;font-size:13px;color:var(--t2);font-weight:700}
.btn-add{background:var(--t1);color:var(--bg);font-weight:700;font-size:13.5px;padding:8px 14px;border-radius:999px;min-height:36px}
.lrow{display:flex;align-items:center;gap:6px;padding:4px 6px;border-radius:14px;width:100%;text-align:left;min-height:58px}
.lrow:hover,.lrow.sel{background:var(--surface2)}
.lrow.hidden-s .nm,.lrow.hidden-s .val{opacity:.4}
.dotbtn{width:44px;height:44px;display:grid;place-items:center;flex:none;border-radius:12px}
.dotbtn i{width:12px;height:12px;border-radius:50%;display:block}
.dotbtn[aria-pressed="false"] i{background:transparent!important;box-shadow:inset 0 0 0 2px var(--t3)}
.lrow .main-btn{flex:1;display:flex;align-items:center;gap:8px;min-width:0;text-align:left;padding:6px 4px;border-radius:10px}
.lrow .nm{flex:1;min-width:0}
.lrow .nm b{font-size:15px;font-weight:700;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lrow .nm em{font-style:normal;font-size:12px;color:var(--t3)}
.lrow .val{text-align:right;white-space:nowrap}
.lrow .val b{font-size:15px;font-weight:800;display:block}
.lrow .val em{font-style:normal;font-size:12px;color:var(--t2)}
.badge{display:inline-block;font-size:10px;font-weight:800;padding:1px 5px;border-radius:5px;background:var(--surface2);color:var(--t2);margin-left:4px;vertical-align:1px}
.badge.nxt{color:var(--accent);background:var(--accent-soft)}
.badge.warn{color:var(--warn);background:color-mix(in srgb,var(--warn) 15%,transparent)}
.lrow .muted{color:var(--t3);font-weight:600}

/* 상세 */
.detail{padding:4px 4px 8px}
.detail h4{font-size:13px;color:var(--t2);padding:12px 12px 6px;font-weight:700}
.d-top{display:flex;align-items:center;gap:8px;padding:2px 12px 2px}
.d-top b{font-size:18px}
.d-top .code{margin-left:auto;font-size:12px;color:var(--t3)}
.d-sub{font-size:12.5px;color:var(--t2);padding:4px 12px 0}
.price-big{font-size:30px;font-weight:800;letter-spacing:-.02em;padding:0 12px}
.price-big span{font-size:16px}
.vcmp{display:flex;margin:10px 8px 4px;background:var(--surface2);border-radius:14px}
.vcmp div{flex:1;padding:10px 12px;min-width:0}
.vcmp div+div{border-left:1px solid var(--line)}
.vcmp span{font-size:11.5px;color:var(--t2);display:block}
.vcmp b{font-size:15px}
.vcmp .cur b{color:var(--accent)}
.kv{display:flex;justify-content:space-between;padding:7px 12px;font-size:14px;gap:12px}
.kv span{color:var(--t2)}
.kv.now,.kv.now span{color:var(--accent);font-weight:800}
.kv.dim{opacity:.45}
.btn{padding:12px 18px;border-radius:14px;font-weight:800;font-size:15px;background:var(--t1);color:var(--bg);min-height:46px}
.btn.ghost{background:var(--surface2);color:var(--t1)}
.btn.danger{background:var(--surface2);color:var(--err)}
.btn.accent{background:var(--accent);color:var(--on-accent)}
.btn.wide{width:100%}
.btns{display:flex;gap:8px;padding:12px 8px 0}
.btns .btn{flex:1}

/* 시트 */
.sheet-root{position:fixed;inset:0;z-index:80}
.sheet-root[hidden]{display:none}
.scrim{position:absolute;inset:0;background:var(--scrim);animation:fade .2s}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:88vh;overflow:auto;background:var(--surface);border-radius:24px 24px 0 0;padding:8px 0 24px;box-shadow:var(--shadow);animation:up .25s cubic-bezier(.2,.8,.2,1)}
@media (min-width:1024px){.sheet{left:50%;right:auto;bottom:auto;top:50%;transform:translate(-50%,-50%);width:440px;border-radius:20px;animation:pop .2s}}
@keyframes up{from{transform:translateY(40px);opacity:.4}}
@keyframes pop{from{transform:translate(-50%,-46%);opacity:0}}
@keyframes fade{from{opacity:0}}
@media (prefers-reduced-motion: reduce){.sheet,.scrim{animation:none}}
.grab{width:36px;height:5px;border-radius:3px;background:var(--line);margin:4px auto 8px}
@media (min-width:1024px){.grab{display:none}}
.sh-head{display:flex;align-items:center;padding:4px 12px 2px 20px}
.sh-head h3{font-size:19px;letter-spacing:-.01em;flex:1}
.sh-sub{font-size:13px;color:var(--t2);padding:0 20px 10px}
.search{margin:4px 16px 8px;display:flex;align-items:center;gap:8px;background:var(--surface2);border-radius:14px;padding:0 14px}
.search input{flex:1;border:0;background:none;font-size:16px;padding:12px 0;outline:none}
.sec-label{font-size:12px;font-weight:700;color:var(--t3);padding:10px 20px 4px}
.srow{display:flex;align-items:center;gap:10px;padding:8px 20px;min-height:56px}
.srow .nm{flex:1;min-width:0}
.srow .nm b{font-size:15px;font-weight:700}
.srow mark{background:none;color:var(--accent)}
.srow em{font-style:normal;font-size:12px;color:var(--t3);display:block}
.addbtn{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--surface2);font-size:20px;font-weight:700;flex:none}
.addbtn.done{background:var(--accent);color:var(--on-accent);font-size:15px}
.addbtn[aria-disabled="true"]{opacity:.35;cursor:not-allowed}
.sheet-foot{display:flex;align-items:center;gap:10px;padding:12px 16px 0;border-top:1px solid var(--line);margin-top:8px}
.sheet-foot span{flex:1;font-size:13px;color:var(--t2)}
.limit{margin:4px 16px;padding:10px 12px;border-radius:12px;background:color-mix(in srgb,var(--warn) 12%,transparent);color:var(--t1);font-size:13px}
.mrow{display:flex;gap:12px;align-items:center;padding:11px 20px;width:100%;text-align:left;min-height:56px}
.mrow .mi{flex:1}
.mrow .mi b{font-size:15px;display:block}
.mrow .mi span{font-size:12.5px;color:var(--t2)}
.mrow.on{background:var(--accent-soft)} .mrow.on b{color:var(--accent)}
.mrow[aria-disabled="true"]{opacity:.42;cursor:not-allowed}
.pcard{display:flex;gap:12px;padding:14px;border:1.5px solid var(--line);border-radius:16px;margin:0 16px 8px;text-align:left;width:calc(100% - 32px)}
.pcard.on{border-color:var(--accent);background:var(--accent-soft)}
.pcard .radio{width:20px;height:20px;border-radius:50%;border:2px solid var(--t3);flex:none;margin-top:2px}
.pcard.on .radio{border:6px solid var(--accent)}
.pcard b{font-size:15px}
.pcard ul{list-style:none;font-size:12.5px;color:var(--t2);margin-top:4px}
.pcard li.y::before{content:"✓ ";color:var(--ok);font-weight:800} .pcard li.n::before{content:"– ";font-weight:800}
.set-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 20px}
.set-row span{font-size:14px;color:var(--t2)}

/* 스낵바 */
.snack{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--t1);color:var(--bg);border-radius:14px;padding:6px 6px 6px 16px;display:flex;align-items:center;gap:12px;font-size:14px;z-index:85;box-shadow:var(--shadow);min-width:280px;max-width:calc(100vw - 32px);animation:fade .2s}
.snack[hidden]{display:none}
.snack span{flex:1}
.snack button{color:var(--accent);font-weight:800;padding:8px 10px;min-height:40px}
:root:not([data-theme="dark"]) .snack button{color:#b9acff}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .snack button{color:var(--accent-ink,#5b47e0)}}
:root[data-theme="dark"] .snack button{color:#5b47e0}
@media (min-width:1024px){.snack{bottom:32px}}

/* ===== PoC 도크 ===== */
.dock{position:fixed;left:50%;transform:translateX(-50%);bottom:12px;z-index:70;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);border-radius:18px;padding:8px 10px;display:flex;align-items:center;gap:10px;width:min(560px,calc(100vw - 16px))}
.dock .play{background:var(--accent);color:var(--on-accent);font-weight:800;font-size:13.5px;border-radius:12px;padding:9px 12px;white-space:nowrap;min-height:40px}
.dock .play.stop{background:var(--err);color:#fff}
.dock .time{display:flex;align-items:center;gap:8px;flex:1;min-width:0}
.dock .time b{font-size:13px;font-weight:800;min-width:42px}
.dock input[type=range]{flex:1;min-width:0;accent-color:var(--accent);height:28px}
.dock .more{width:40px;height:40px;border-radius:12px;background:var(--surface2);font-weight:800}
.dock-panel{position:fixed;left:50%;transform:translateX(-50%);bottom:72px;z-index:70;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);border-radius:18px;padding:12px;width:min(560px,calc(100vw - 16px));display:flex;flex-direction:column;gap:10px}
.dock-panel[hidden]{display:none}
.dock-panel .lbl{font-size:12px;color:var(--t2);font-weight:700;width:60px}
.dock-panel .row{flex-wrap:nowrap}
.dock-panel .seg button{padding:5px 10px;min-height:34px;font-size:13px}
.dock-panel p{font-size:11.5px;color:var(--t3)}
@media (min-width:1024px){.dock{left:auto;right:16px;transform:none;width:520px}.dock-panel{left:auto;right:16px;transform:none;width:520px}}

/* 데모: 가상 손가락·자막 */
.finger{position:fixed;left:0;top:0;width:44px;height:44px;margin:-22px 0 0 -22px;border-radius:50%;background:rgba(139,123,255,.28);border:2.5px solid rgba(255,255,255,.95);box-shadow:0 4px 18px rgba(0,0,0,.35),0 0 0 1px rgba(0,0,0,.15);z-index:90;pointer-events:none;transition:transform .55s cubic-bezier(.2,.8,.2,1),opacity .3s,scale .12s;opacity:0}
.finger.show{opacity:1}
.finger.press{scale:.78;background:rgba(139,123,255,.55)}
.finger.hold::after{content:"";position:absolute;inset:-10px;border-radius:50%;border:2px solid rgba(139,123,255,.8);animation:ring .5s ease-out}
.finger.drag{transition:transform .03s linear,opacity .3s,scale .12s}
@keyframes ring{from{transform:scale(.6);opacity:1}to{transform:scale(1.2);opacity:0}}
.ripple{position:fixed;width:16px;height:16px;margin:-8px 0 0 -8px;border-radius:50%;background:rgba(139,123,255,.55);z-index:89;pointer-events:none;animation:rip .5s ease-out forwards}
@keyframes rip{to{transform:scale(4.5);opacity:0}}
.caption{position:fixed;left:50%;top:12px;transform:translateX(-50%);z-index:95;background:rgba(17,19,23,.88);color:#fff;border-radius:16px;padding:10px 16px;font-size:14.5px;font-weight:600;max-width:min(560px,calc(100vw - 24px));box-shadow:0 8px 30px rgba(0,0,0,.35);display:flex;gap:10px;align-items:flex-start;backdrop-filter:blur(8px)}
.caption[hidden]{display:none}
.caption i{font-style:normal;font-size:11px;font-weight:800;background:rgba(255,255,255,.18);border-radius:6px;padding:2px 6px;margin-top:2px;white-space:nowrap}

<script>
'use strict';
/* =========================================================
 * 0. 유틸
 * ======================================================= */
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function hashSeed(s){ let h=2166136261; for(const c of s){ h^=c.charCodeAt(0); h=Math.imul(h,16777619);} return h>>>0; }
function rng(seed){ return ()=>{ seed|=0; seed=seed+0x6D2B79F5|0; let t=Math.imul(seed^seed>>>15,1|seed); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
function gauss(r){ let u=0,v=0; while(!u)u=r(); while(!v)v=r(); return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v); }
const won = n => Math.round(n).toLocaleString('ko-KR');
const pad2 = n => String(n).padStart(2,'0');
const START_MIN = 8*60, SPAN = 720;              // 08:00 기준 분 인덱스, 08:00~20:00
const clock = m => { const t=START_MIN+m; return pad2(Math.floor(t/60))+':'+pad2(t%60); };
function tick(p, type){
  if(type==='ETF') return Math.round(p/5)*5;
  const u = p<2000?1:p<5000?5:p<20000?10:p<50000?50:p<200000?100:p<500000?500:1000;
  return Math.round(p/u)*u;
}
/* 날짜(YYYY-MM-DD) 산술 — 시간대와 무관하게 UTC 달력으로만 계산 */
const D = s => { const [y,m,d]=s.split('-').map(Number); return Date.UTC(y,m-1,d); };
const S = ms => new Date(ms).toISOString().slice(0,10);
const addDays = (s,n) => S(D(s)+n*864e5);
const addMonths = (s,n) => { const d=new Date(D(s)); d.setUTCMonth(d.getUTCMonth()+n); return S(+d); };
const wd = s => new Date(D(s)).getUTCDay();
const md = s => { const [,m,d]=s.split('-'); return (+m)+'/'+(+d); };
const WK = '일월화수목금토';

/* =========================================================
 * 1. 거래일 (PoC용 가상 휴장일 목록)
 * ======================================================= */
const HOLIDAYS = new Set(['2025-08-15','2025-10-03','2025-10-06','2025-10-07','2025-10-08','2025-10-09','2025-12-25','2025-12-31','2026-01-01','2026-02-16','2026-02-17','2026-02-18','2026-03-02','2026-05-01','2026-05-05','2026-05-25','2026-06-03','2026-08-17','2026-09-24','2026-09-25','2026-10-05','2026-10-09']);
const LAST_DAY = '2026-10-08';
const TD = (()=>{ const out=[]; for(let d='2025-07-01'; d<=LAST_DAY; d=addDays(d,1)){ const w=wd(d); if(w&&w!==6&&!HOLIDAYS.has(d)) out.push(d);} return out; })();
const TD_INDEX = new Map(TD.map((d,i)=>[d,i]));

/* =========================================================
 * 2. 종목 유니버스 (가상 수치)
 * ======================================================= */
const UNIVERSE = [
 ['005930','삼성전자','KOSPI','STOCK',1,70000,5.92e9], ['000660','SK하이닉스','KOSPI','STOCK',1,205000,7.28e8],
 ['042700','한미반도체','KOSPI','STOCK',0,98000,9.7e7], ['000990','DB하이텍','KOSPI','STOCK',1,48000,4.4e7],
 ['009150','삼성전기','KOSPI','STOCK',1,150000,7.5e7], ['058470','리노공업','KOSDAQ','STOCK',0,190000,1.5e7],
 ['373220','LG에너지솔루션','KOSPI','STOCK',1,380000,2.34e8], ['006400','삼성SDI','KOSPI','STOCK',1,250000,6.9e7],
 ['247540','에코프로비엠','KOSDAQ','STOCK',1,120000,9.8e7], ['086520','에코프로','KOSDAQ','STOCK',1,60000,1.33e8],
 ['003670','포스코퓨처엠','KOSPI','STOCK',1,180000,7.7e7], ['105560','KB금융','KOSPI','STOCK',1,110000,3.9e8],
 ['055550','신한지주','KOSPI','STOCK',1,60000,5.0e8], ['086790','하나금융지주','KOSPI','STOCK',1,85000,2.8e8],
 ['005935','삼성전자우','KOSPI','STOCK',1,58000,8.2e8], ['005380','현대차','KOSPI','STOCK',1,220000,2.0e8],
 ['000270','기아','KOSPI','STOCK',1,100000,3.9e8], ['035420','NAVER','KOSPI','STOCK',1,210000,1.5e8],
 ['035720','카카오','KOSPI','STOCK',1,55000,4.4e8], ['068270','셀트리온','KOSPI','STOCK',1,180000,2.1e8],
 ['128940','한미약품','KOSPI','STOCK',1,300000,1.28e7], ['008930','한미사이언스','KOSPI','STOCK',1,30000,6.8e7],
 ['012450','한화에어로스페이스','KOSPI','STOCK',1,900000,5.1e7], ['329180','HD현대중공업','KOSPI','STOCK',1,400000,8.9e7],
 ['034020','두산에너빌리티','KOSPI','STOCK',1,60000,6.4e8], ['196170','알테오젠','KOSDAQ','STOCK',1,400000,5.3e7],
 ['277810','레인보우로보틱스','KOSDAQ','STOCK',0,250000,1.9e7], ['069500','KODEX 200','KOSPI','ETF',0,45000,1.0e8],
 ['122630','KODEX 레버리지','KOSPI','ETF',0,25000,2.0e8], ['360750','TIGER 미국S&P500','KOSPI','ETF',0,22000,3.0e8],
].map(([sym,name,market,type,nxt,p0,shares])=>({sym,name,market,type,nxt:!!nxt,p0,shares}));
const META = new Map(UNIVERSE.map(m=>[m.sym,m]));
const HALTS = { '042700': new Set(['2026-10-06']) }; // 가상 거래정지 이력

/* =========================================================
 * 3. 세션과 KRX 우선 규칙 (스펙 5.2, 계획 Task 2·3)
 *    분 인덱스 m: 0 = 08:00, 720 = 20:00
 * ======================================================= */
const KRX_EXCLUDED_AFTER = new Set(['ETF','ETN']);
const krxCont = (meta,m) => (m>=60&&m<440) || (m>=480&&m<720&&!KRX_EXCLUDED_AFTER.has(meta.type));
const nxtCont = (meta,m) => meta.nxt && ((m>=0&&m<50) || (m>=60.5&&m<440) || (m>=460&&m<720));
const krxAuction = m => (m>=30&&m<60) || (m>=440&&m<450);
const nxtAuction = (meta,m) => meta.nxt && m>=450&&m<460;
/** 불변 원칙: KRX가 접속매매 중이면 KRX, 아니면 NXT, 둘 다 아니면 null */
const autoVenueAt = (meta,m) => krxCont(meta,m) ? 'KRX' : nxtCont(meta,m) ? 'NXT' : null;

/** 분 m에서 이 종목·모드의 상태: {venue, kind:'c'|'a'|null, fallback} */
function venueKindAt(meta, mode, m){
  if(mode==='AUTO'){
    const v = autoVenueAt(meta,m); if(v) return {venue:v, kind:'c'};
    if(krxAuction(m) && !(meta.nxt && m<50)) return {venue:'KRX', kind:'a'};
    if(nxtAuction(meta,m)) return {venue:'NXT', kind:'a'};
    return {venue:null, kind:null};
  }
  if(mode==='KRX' || (mode==='NXT' && !meta.nxt)){
    const fb = mode==='NXT';
    if(krxCont(meta,m)) return {venue:'KRX', kind:'c', fallback:fb};
    if(krxAuction(m)) return {venue:'KRX', kind:'a', fallback:fb};
    return {venue:null, kind:null, fallback:fb};
  }
  if(mode==='NXT'){
    if(nxtCont(meta,m)) return {venue:'NXT', kind:'c'};
    if(nxtAuction(meta,m)) return {venue:'NXT', kind:'a'};
    return {venue:null, kind:null};
  }
  // UNIFIED
  if(krxCont(meta,m)||nxtCont(meta,m)) return {venue:'UNIFIED', kind:'c'};
  if(krxAuction(m)||nxtAuction(meta,m)) return {venue:'UNIFIED', kind:'a'};
  return {venue:null, kind:null};
}
function intervalsFor(meta, mode){
  const out=[]; let cur=null;
  for(let m=0;m<SPAN;m++){
    const k=venueKindAt(meta,mode,m); const key=k.venue+'|'+k.kind;
    if(cur && cur.key===key){ cur.end=m+1; continue; }
    cur={key, start:m, end:m+1, venue:k.venue, kind:k.kind, fallback:!!k.fallback}; out.push(cur);
  }
  return out;
}
/** 상태 칩용 시장 전체 세션 이름 */
function marketSessionAt(m){
  if(m<0) return {label:'장 시작 전', venue:null, live:false};
  if(m<50) return {label:'NXT 프리', venue:'NXT', live:true};
  if(m<60) return {label:'KRX 시가 단일가', venue:'KRX', live:true};
  if(m<440) return {label:'KRX 정규', venue:'KRX', live:true};
  if(m<450) return {label:'KRX 종가 단일가', venue:'KRX', live:true};
  if(m<460) return {label:'NXT 종가 단일가', venue:'NXT', live:true};
  if(m<480) return {label:'NXT 애프터', venue:'NXT', live:true};
  if(m<720) return {label:'KRX 애프터', venue:'KRX', live:true};
  return {label:'장 마감', venue:null, live:false};
}
const MARKET_TIMETABLE = [
  ['NXT 프리','08:00–08:50',0,50], ['KRX 시가 단일가','08:30–09:00',30,60], ['KRX 정규','09:00–15:30',60,450],
  ['NXT 정규','09:00:30–15:20',60,440], ['NXT 종가 단일가','15:30–15:40',450,460], ['NXT 애프터','15:40–20:00',460,720],
  ['KRX 애프터 (ETF·ETN 제외)','16:00–20:00',480,720],
];
function stockTimetable(meta){
  const rows=[];
  if(meta.nxt) rows.push(['NXT 프리','08:00–08:50',0,50]);
  rows.push(['KRX 시가 단일가','08:30–09:00',30,60], ['KRX 정규','09:00–15:30',60,450]);
  if(meta.nxt) rows.push(['NXT 애프터','15:30–20:00',450,720]);
  if(!KRX_EXCLUDED_AFTER.has(meta.type)) rows.push(['KRX 애프터','16:00–20:00',480,720]);
  else rows.push(['KRX 애프터','ETF·ETN은 거래 대상 아님',-1,-1]);
  return rows;
}

/* =========================================================
 * 4. 가상 시세 생성 (종목별 결정적)
 * ======================================================= */
const DATA = new Map();
function dataFor(sym){
  if(DATA.has(sym)) return DATA.get(sym);
  const meta = META.get(sym), r = rng(hashSeed(sym));
  const vol = meta.type==='ETF' ? 0.009 : 0.013 + r()*0.016;
  const drift = (r()-0.45)*0.0018;
  const days = TD.filter(d=>d<LAST_DAY);
  let lp=0; const lps=[];
  for(const _ of days){ lp += drift + gauss(r)*vol; lps.push(lp); }
  const scale = meta.p0/Math.exp(lps[lps.length-1]);
  const avgVol = meta.shares*(0.0015+r()*0.006);
  const daily = days.map((d,i)=>{
    const halted = HALTS[sym]?.has(d);
    const c = halted ? null : tick(scale*Math.exp(lps[i]), meta.type);
    return { d, c, v: halted?0:avgVol*Math.exp(gauss(r)*0.45), nxtC: c && meta.nxt ? tick(c*(1+gauss(r)*0.002), meta.type) : null };
  });
  const prev = [...daily].reverse().find(x=>x.c).c;
  // 당일(10/8) 분 단위 공정가 → 거래소별 가격
  const fair=new Float64Array(SPAN), KRX=new Float64Array(SPAN), NXT=new Float64Array(SPAN), volK=new Float64Array(SPAN), volN=new Float64Array(SPAN);
  let f = prev*(1+gauss(r)*0.004); const dIn=(r()-0.5)*0.00005;
  for(let m=0;m<SPAN;m++){
    const reg = m>=60&&m<450, sig = vol/Math.sqrt(390)*(reg?1:0.55);
    f *= 1 + dIn + gauss(r)*sig; fair[m]=f;
    KRX[m]=tick(f*(1+gauss(r)*0.00025), meta.type); NXT[m]=tick(f*(1+0.0003+gauss(r)*0.0004), meta.type);
    const u = reg ? 1+1.6*Math.pow((m-255)/195,2) : 1;
    volK[m] = reg ? avgVol/390*u*Math.exp(gauss(r)*0.5)/2.2 : (m>=480 ? avgVol/390*0.08*Math.exp(gauss(r)*0.5) : 0);
    volN[m] = meta.nxt ? avgVol/390*(reg?0.3:0.12)*Math.exp(gauss(r)*0.5) : 0;
  }
  const krxClose = tick(fair[449], meta.type);
  let regVol=0; for(let m=60;m<450;m++) regVol+=volK[m];
  daily.push({ d:LAST_DAY, c:krxClose, v:regVol, nxtC: meta.nxt? NXT[SPAN-1] : null });
  const obj = { meta, daily, prev, KRX, NXT, volK, volN, krxClose };
  DATA.set(sym, obj); return obj;
}
const INDEX = {};
function indexFor(name){
  if(INDEX[name]) return INDEX[name];
  const r=rng(hashSeed(name)), p0 = name==='KOSPI'?3480:905, vol=0.009;
  const days=TD.filter(d=>d<LAST_DAY); let lp=0; const lps=days.map(()=>lp+=gauss(r)*vol+0.0004);
  const sc=p0/Math.exp(lps.at(-1)); const daily=days.map((d,i)=>({d,c:sc*Math.exp(lps[i])}));
  const prev=daily.at(-1).c; const intra=new Float64Array(SPAN); let f=prev*(1+gauss(r)*0.003);
  for(let m=0;m<SPAN;m++){ if(m>=60&&m<450) f*=1+gauss(r)*vol/Math.sqrt(390); intra[m]=f; }
  daily.push({d:LAST_DAY,c:intra[449]});
  return INDEX[name]={daily,prev,intra};
}

/* =========================================================
 * 5. 상태
 * ======================================================= */
const METRICS = [
  {id:'change', label:'등락률', desc:'기간 시작 직전 종가 대비 몇 % 올랐나', unit:'%', spark:'0,16 10,12 20,13 30,7 44,4'},
  {id:'drawdown', label:'고점 대비 하락률', desc:'기간 중 최고가에서 얼마나 내려왔나', unit:'%', spark:'0,4 10,4 18,10 28,8 44,14'},
  {id:'excess', label:'시장 대비 초과수익', desc:'KOSPI·KOSDAQ보다 얼마나 더 올랐나', unit:'%', spark:'0,12 12,11 22,8 32,9 44,5'},
  {id:'rvol', label:'상대 거래량', desc:'평소(20일 평균) 대비 거래량 배수', unit:'x', spark:'0,16 10,15 18,6 26,13 44,12'},
  {id:'mcap', label:'시가총액', desc:'발행주식수 × 가격 (조 원)', unit:'조', spark:'0,10 10,10 22,9 32,8 44,7'},
  {id:'volatility', label:'변동성', desc:'20일 수익률 표준편차(연율)', unit:'%', v11:true, spark:'0,11 8,6 16,15 26,5 44,12'},
  {id:'rsi', label:'RSI(14)', desc:'과열·침체 비교 (0–100)', unit:'', v11:true, spark:'0,14 10,6 22,10 32,4 44,9'},
];
const MET = Object.fromEntries(METRICS.map(m=>[m.id,m]));
const PERIODS = [['D',1],['W',1],['W',2],['W',3],['W',4],['M',1],['M',2],['M',3],['M',4],['M',5],['M',6],['Y',1]];
const COUNTS = { W:[1,2,3,4], M:[1,2,3,4,5,6] };
const UNIT_LABEL = { D:'일', W:'주', M:'월', Y:'년' };

function initialState(){
  return {
    provider:'kis', theme:'system', conv:'kr', holiday:false, nowMin:582,
    groups:[
      {id:'g1', name:'반도체', items:[['005930',1],['000660',2],['042700',3],['069500',4]]},
      {id:'g2', name:'2차전지', items:[['373220',1],['006400',2],['247540',3],['086520',4],['003670',5]]},
      {id:'g3', name:'배당', items:[['105560',1],['055550',2],['086790',3],['005935',4]]},
    ].map(g=>({...g, items:g.items.map(([sym,slot])=>({sym,slot,hidden:false}))})),
    activeGroup:'g1', period:{unit:'D',n:1}, metric:'change', venueMode:'AUTO', lastKisVenue:'AUTO',
    scrub:null, frozen:null, selected:null, sheet:null, addedThisSheet:0, query:'', recent:['009150','069500','035420'],
  };
}
let state = initialState();
const group = () => state.groups.find(g=>g.id===state.activeGroup);
const isDesktop = () => innerWidth>=1024;
const isSide = () => (innerWidth>=600 && innerWidth>innerHeight) || innerWidth>=900;

/* =========================================================
 * 6. 시리즈·지표 계산
 * ======================================================= */
function lastIdxIntraday(){ return state.holiday ? SPAN-1 : Math.min(state.nowMin, SPAN-1); }
function computeModel(){
  const g=group(), mode=state.venueMode, metric=state.metric, intraday = state.period.unit==='D';
  const series = g.items.map(it=>({ it, meta:META.get(it.sym), d:dataFor(it.sym) }));
  if(intraday){
    const last = lastIdxIntraday();
    for(const s of series){
      const {meta,d} = s, base=d.prev; s.base=base;
      const prices=new Array(SPAN).fill(null), venues=new Array(SPAN).fill(null), vals=new Array(SPAN).fill(null);
      const idx=indexFor(meta.market==='KOSDAQ'?'KOSDAQ':'KOSPI');
      let runMax=-Infinity, cum=0;
      const avg20 = d.daily.slice(-21,-1).filter(x=>x.v>0).reduce((a,x)=>a+x.v,0)/20;
      for(let m=0;m<=last;m++){
        const k = venueKindAt(meta,mode,m);
        if(k.kind!=='c') continue;
        let p, ven=k.venue;
        if(ven==='UNIFIED'){ p = krxCont(meta,m)? d.KRX[m] : d.NXT[m]; cum += d.volK[m]+d.volN[m]; }
        else if(ven==='KRX'){ p=d.KRX[m]; cum+=d.volK[m]; } else { p=d.NXT[m]; cum+=d.volN[m]; }
        prices[m]=p; venues[m]=ven; runMax=Math.max(runMax,p);
        const ip = idx.intra[m];
        vals[m] = metric==='change' ? (p/base-1)*100
          : metric==='drawdown' ? (p/runMax-1)*100
          : metric==='excess' ? (p/base-1)*100 - (ip/idx.prev-1)*100
          : metric==='rvol' ? cum/avg20
          : metric==='mcap' ? p*meta.shares/1e12 : null;
      }
      s.prices=prices; s.venues=venues; s.vals=vals;
      s.baseVal = metric==='mcap' ? base*meta.shares/1e12 : 0;
      s.intervals = intervalsFor(meta,mode);
      s.fallback = mode==='NXT' && !meta.nxt;
    }
    return { kind:'intraday', len:SPAN, last, series, unit:MET[metric].unit, baseline: metric==='mcap'?null:(metric==='rvol'?null:0),
      label:i=>clock(i), dayLabel: state.holiday ? '10/8(목)' : '오늘', baseDesc:'기준 전일 종가', markers:false };
  }
  // 일봉
  const {unit,n}=state.period;
  const cutoff = unit==='W' ? addDays(LAST_DAY,-7*n) : unit==='M' ? addMonths(LAST_DAY,-n) : addMonths(LAST_DAY,-12);
  const days = TD.filter(d=>d>cutoff && d<=LAST_DAY);
  const baseDay = [...TD].reverse().find(d=>d<=cutoff);
  const dates=[baseDay,...days];
  for(const s of series){
    const {meta,d}=s; const byDay=new Map(d.daily.map(x=>[x.d,x]));
    const useNxt = mode==='NXT' && meta.nxt;
    const closeOf = day => { const x=byDay.get(day); return x ? (useNxt ? x.nxtC : x.c) : null; };
    let bi=TD_INDEX.get(baseDay), base=null; while(bi>=0 && (base=closeOf(TD[bi]))==null) bi--;
    const idx=indexFor(meta.market==='KOSDAQ'?'KOSDAQ':'KOSPI'); const iBy=new Map(idx.daily.map(x=>[x.d,x.c])); const iBase=iBy.get(baseDay);
    let runMax=-Infinity;
    s.base=base; s.prices=dates.map(day=>closeOf(day)); s.venues=dates.map(()=>useNxt?'NXT':'KRX');
    s.vals = dates.map((day,i)=>{
      const p=s.prices[i]; if(i===0) return metric==='mcap'? base*meta.shares/1e12 : (metric==='rvol'?null:0);
      if(p==null) return null; runMax=Math.max(runMax,p);
      if(metric==='change') return (p/base-1)*100;
      if(metric==='drawdown') return (p/runMax-1)*100;
      if(metric==='excess') return (p/base-1)*100 - (iBy.get(day)/iBase-1)*100;
      if(metric==='mcap') return p*meta.shares/1e12;
      if(metric==='rvol'){ const k=d.daily.findIndex(x=>x.d===day); const prev=d.daily.slice(Math.max(0,k-20),k).filter(x=>x.v>0); const a=prev.reduce((t,x)=>t+x.v,0)/(prev.length||1); return d.daily[k].v/a; }
      return null;
    });
    s.baseVal = s.vals[0] ?? (metric==='rvol'?1:0);
    s.fallback = mode==='NXT' && !meta.nxt;
  }
  return { kind:'daily', len:dates.length, last:dates.length-1, dates, series, unit:MET[metric].unit,
    baseline: metric==='mcap'?null:(metric==='rvol'?1:0), label:i=> i===0? md(dates[0])+' 기준' : md(dates[i]),
    dayLabel: `${n}${unit==='Y'?'년':unit==='W'?'주':'개월'}`, baseDesc:`기준 ${md(baseDay)} 종가`, markers: dates.length<=21 };
}

function refIdx(){ return state.scrub ?? MODEL.last; }
function valueAt(s,i){ for(let k=i;k>=0;k--){ if(s.vals[k]!=null) return {v:s.vals[k], live:k===i}; } return {v:MODEL.kind==='daily'?null:(state.metric==='rvol'?null:s.baseVal), live:false}; }
function priceAt(s,i){ for(let k=i;k>=0;k--){ if(s.prices[k]!=null) return {p:s.prices[k], venue:s.venues[k], live:k===i}; } return {p:s.base, venue:'KRX', live:false}; }

function fmtVal(v, unit){
  if(v==null) return '—';
  if(unit==='%') return (v>0.005?'▲ +':v<-0.005?'▼ ':'')+v.toFixed(2)+'%';
  if(unit==='x') return v.toFixed(2)+'x';
  if(unit==='조') return v.toFixed(v<10?2:1)+'조';
  return v.toFixed(1);
}
const trend = (v,unit) => unit==='%' && v!=null ? (v>0.005?'up':v<-0.005?'down':'') : '';
function niceStep(raw){ const p=Math.pow(10,Math.floor(Math.log10(raw))), f=raw/p; return (f<=1?1:f<=2?2:f<=5?5:10)*p; }
function fmtTick(v,unit,step){
  const dec = step<0.1?2:step<1?1:0;
  if(unit==='%') return (v>0?'+':'')+v.toFixed(dec)+'%';
  if(unit==='x') return v.toFixed(Math.max(1,dec))+'x';
  if(unit==='조') return v.toFixed(dec)+'조';
  return v.toFixed(dec);
}

const CHO='ㄱㄲㄴㄷㄸㄹㅁㅂㅃㅅㅆㅇㅈㅉㅊㅋㅌㅍㅎ';
const choOf = c => { const k=c.charCodeAt(0)-0xAC00; return k>=0&&k<11172 ? CHO[Math.floor(k/588)] : c; };
const isCho = c => CHO.includes(c);
function matchPos(name,q){
  const N=name.toLowerCase(), Q=q.toLowerCase();
  for(let s=0;s+Q.length<=N.length;s++){ let ok=true; for(let j=0;j<Q.length;j++){ const qc=Q[j], nc=N[s+j]; if(isCho(qc)? choOf(nc)!==qc : nc!==qc){ok=false;break;} } if(ok) return s; }
  return -1;
}
function search(q){
  q=q.trim(); if(!q) return [];
  const hasCho=[...q].some(isCho);
  return UNIVERSE.map(m=>{ if(/^\d+$/.test(q) && m.sym.startsWith(q)) return {m,score:0,pos:-1};
      const p=matchPos(m.name,q); if(p<0) return null; return {m,score: p===0?(hasCho?2:1):(hasCho?4:3), pos:p}; })
    .filter(Boolean).sort((a,b)=>a.score-b.score||a.m.name.length-b.m.name.length).slice(0,20);
}
function hl(name,pos,len){ if(pos<0) return esc(name); return esc(name.slice(0,pos))+'<mark>'+esc(name.slice(pos,pos+len))+'</mark>'+esc(name.slice(pos+len)); }
function addRows(list){
  const g=group(), full=g.items.length>=8;
  return list.map(({m,pos})=>{ const has=g.items.some(i=>i.sym===m.sym);
    return `<div class="srow"><div class="nm"><b>${hl(m.name,pos??-1,state.query.trim().length)}</b>${m.nxt?'<span class="badge nxt">NXT</span>':''}${m.type!=='STOCK'?`<span class="badge">${m.type}</span>`:''}<em class="num">${m.sym} · ${m.market}${has?' · 추가됨':''}</em></div>
    <button class="addbtn ${has?'done':''}" ${!has&&full?'aria-disabled="true"':''} aria-label="${esc(m.name)} ${has?'추가됨':'추가'}" data-act="${has?'noop':'add'}" data-v="${m.sym}" data-demo="add-${m.sym}">${has?'✓':'＋'}</button></div>`; }).join('');
}
function renderAddResults(){

    + (q.trim() ? (()=>{ const r=search(q); return r.length? `<div class="sec-label">검색 결과 ${r.length}</div>`+addRows(r) : `<div class="sec-label">'${esc(q)}'에 맞는 종목이 없어요</div>`; })()

}

 * ======================================================= */
function setPeriod(unit,n){ state.period={unit, n: n ?? (COUNTS[unit]?.includes(state.period.n) && state.period.unit===unit ? state.period.n : (unit==='W'?2:unit==='M'?3:1))}; clearScrubSilent(); render(); }
function clearScrubSilent(){ state.scrub=null; state.frozen=null; }
function stepPeriod(dir){ const k=PERIODS.findIndex(([u,n])=>u===state.period.unit&&n===state.period.n); const [u,n]=PERIODS[Math.max(0,Math.min(PERIODS.length-1,k+dir))]; state.period={unit:u,n}; clearScrubSilent(); render(); }
function setVenue(v){
  if(state.provider==='toss' && v!=='UNIFIED'){ snack('토스는 통합 시세만 제공해요'); return; }
  state.venueMode=v; if(state.provider==='kis') state.lastKisVenue=v; clearScrubSilent(); render();
}
function setProvider(p){
  state.provider=p;
  if(p==='toss'){ state.venueMode='UNIFIED'; } else { state.venueMode=state.lastKisVenue||'AUTO'; }
  clearScrubSilent(); render(); snack(p==='toss'?'토스증권으로 바꿨어요 · 통합 시세만 볼 수 있어요':'한국투자증권으로 바꿨어요 · KRX·NXT를 고를 수 있어요');
}
function addSym(sym){
  const g=group(); if(g.items.some(i=>i.sym===sym)) return;
  if(g.items.length>=8){ snack('한 차트에 8개까지 비교할 수 있어요'); return; }
  const used=new Set(g.items.map(i=>i.slot)); let slot=1; while(used.has(slot)) slot++;
  g.items.push({sym,slot,hidden:false}); state.addedThisSheet++; state.recent=[sym,...state.recent.filter(s=>s!==sym)].slice(0,5);
  render();
}
function deleteSym(sym){
  const g=group(), k=g.items.findIndex(i=>i.sym===sym); if(k<0) return; const [it]=g.items.splice(k,1);
  if(state.selected===sym) state.selected=null; closeSheet(); clearScrubSilent(); render();
  snack(`${META.get(sym).name}을(를) 삭제했어요`, {label:'되돌리기', run:()=>{ g.items.splice(k,0,it); state.selected=sym; render(); snack('되돌렸어요'); }});
}
function applyTheme(){ const r=document.documentElement; if(state.theme==='system') r.removeAttribute('data-theme'); else r.setAttribute('data-theme',state.theme); r.classList.toggle('global-colors', state.conv==='global'); render(); }

document.addEventListener('click', e=>{
  const b=e.target.closest('[data-act]'); if(!b) return;
  if(b.getAttribute('aria-disabled')==='true'){ if(b.title) snack(b.title); return; }
  const v=b.dataset.v;
  switch(b.dataset.act){
    case 'group': state.activeGroup=v; state.selected=null; clearScrubSilent(); render(); break;
    case 'new-group': { const id='g'+Date.now(); state.groups.push({id,name:'새 그룹 '+(state.groups.length+1),items:[]}); state.activeGroup=id; clearScrubSilent(); render(); snack('새 그룹을 만들었어요'); break; }
    case 'unit': setPeriod(v); break;
    case 'count': state.period={unit:state.period.unit,n:+v}; clearScrubSilent(); render(); break;
    case 'venue': setVenue(v); break;
    case 'metric-sheet': openSheet('metric'); break;
    case 'pick-metric': state.metric=v; closeSheet(); clearScrubSilent(); render(); break;
    case 'open-add': openSheet('add'); break;
    case 'add': addSym(v); break;
    case 'toggle-hidden': { const it=group().items.find(i=>i.sym===v); it.hidden=!it.hidden; render(); break; }
    case 'select': state.selected=v; if(isDesktop()){ renderBoard(); renderRail(); renderDetailInline(); } else openSheet('detail'); break;
    case 'delete': deleteSym(v); break;
    case 'snack-action': { const el=$('#snack'); el.hidden=true; el._action?.(); break; }
    case 'close-sheet': closeSheet(); break;
    case 'sessions': openSheet('sessions'); break;
    case 'settings': openSheet('settings'); break;
    case 'provider': setProvider(v); break;
    case 'dp-prov': setProvider(v); break;
    case 'dp-theme': state.theme=v; applyTheme(); break;
    case 'conv': state.conv=v; applyTheme(); break;
    case 'dp-date': state.holiday = v==='hol'; clearScrubSilent(); render(); break;
    case 'example': { const g=group(); g.items=[['005930',1],['000660',2],['042700',3],['000990',4]].map(([sym,slot])=>({sym,slot,hidden:false})); render(); break; }
    case 'toast': snack(v); break;
  }
});
/* 시각 슬라이더 */
$('#timeSlider').addEventListener('input', e=>{ state.nowMin=+e.target.value; clearScrubSilent(); render(); });
$('#moreBtn').addEventListener('click', ()=>{ const p=$('#dockPanel'); p.hidden=!p.hidden; $('#moreBtn').setAttribute('aria-expanded',String(!p.hidden)); });
/* 차트 스크럽: 마우스는 hover, 터치는 길게 눌러 끌기 */
(()=>{
  const el=$('#chart'); let hold=null, active=false, sx=0, sy=0;
  el.addEventListener('pointermove', e=>{
    if(e.pointerType==='mouse'){ scrubToClientX(e.clientX); return; }
    if(active){ scrubToClientX(e.clientX); return; }
    if(hold && (Math.abs(e.clientY-sy)>10 || Math.abs(e.clientX-sx)>10)){ clearTimeout(hold); hold=null; }
  });
  el.addEventListener('pointerleave', e=>{ if(e.pointerType==='mouse') clearScrub(); });
  el.addEventListener('pointerdown', e=>{ if(e.pointerType==='mouse') return; sx=e.clientX; sy=e.clientY;
    hold=setTimeout(()=>{ active=true; try{el.setPointerCapture(e.pointerId);}catch{} scrubToClientX(sx); navigator.vibrate?.(8); }, 220); });
  const end=()=>{ clearTimeout(hold); hold=null; if(active){ active=false; clearScrub(); } };
  el.addEventListener('pointerup', end); el.addEventListener('pointercancel', end);
  el.addEventListener('contextmenu', e=>e.preventDefault());
})();
/* 단축키 */
document.addEventListener('keydown', e=>{
  if(e.key==='Escape'){ closeSheet(); $('#dockPanel').hidden=true; return; }
  if(e.target.matches('input,textarea')||e.metaKey||e.ctrlKey||e.altKey) return;
  const k=e.key;
  if(k==='/'){ e.preventDefault(); openSheet('add'); }
  else if(k==='['){ stepPeriod(-1); } else if(k===']'){ stepPeriod(1); }
  else if(k==='m'||k==='M'){ openSheet('metric'); }
  else if(k==='v'||k==='V'){ const order=['AUTO','KRX','NXT','UNIFIED'].filter(x=>state.provider==='kis'||x==='UNIFIED'); setVenue(order[(order.indexOf(state.venueMode)+1)%order.length]); }
  else if(k==='h'||k==='H'){ const it=group().items.find(i=>i.sym===state.selected); if(it){ it.hidden=!it.hidden; render(); } else snack('먼저 종목을 선택하세요'); }
  else if(k==='?'){ openSheet('help'); }
});
let rz; addEventListener('resize', ()=>{ clearTimeout(rz); rz=setTimeout(()=>{ if(state.sheet==='detail'&&isDesktop()) closeSheet(); render(); },120); });
setInterval(()=>{ if(!state.holiday && state.nowMin<SPAN && state.scrub==null) renderHead(); }, 1000);

/* =========================================================
 * 13. 자동 데모 (가상 손가락)
 * ======================================================= */
const demo={running:false, token:0};
const finger=$('#finger'), cap=$('#caption');
window.DEMO_FAST = new URLSearchParams(location.search).has('fast'); // 검증용: 대기 없이 끝까지 실행
const sleep=ms=>window.DEMO_FAST ? new Promise(r=>{ const c=new MessageChannel(); c.port1.onmessage=()=>r(); c.port2.postMessage(0); }) : new Promise(r=>setTimeout(r,ms));
async function w(ms){ const t=demo.token; await sleep(ms); if(t!==demo.token||!demo.running) throw new Error('stopped'); }
let fx=innerWidth/2, fy=innerHeight-120;
function placeFinger(x,y,instant){ fx=x; fy=y; finger.classList.toggle('drag',!!instant); finger.style.transform=`translate(${x}px,${y}px)`; }
async function waitFor(sel, ms=2500){ const t0=performance.now(); while(performance.now()-t0<ms){ const el=document.querySelector(sel); if(el && el.getClientRects().length) return el; await w(60);} throw new Error('demo target not found: '+sel); }
async function moveTo(sel){
  const el = typeof sel==='string' ? await waitFor(sel) : sel;
  let r=el.getBoundingClientRect();
  const dockTop=$('#dock').getBoundingClientRect().top;
  if(r.top<60 || r.bottom>dockTop-10){ el.scrollIntoView({block:'center',behavior:window.DEMO_FAST?'auto':'smooth'}); await w(550); r=el.getBoundingClientRect(); }
  placeFinger(r.left+r.width/2, r.top+r.height/2); await w(600);
  return el;
}
async function tap(sel){
  const el=await moveTo(sel);
  finger.classList.add('press'); const rp=document.createElement('div'); rp.className='ripple'; rp.style.left=fx+'px'; rp.style.top=fy+'px'; document.body.appendChild(rp); setTimeout(()=>rp.remove(),600);
  await w(130); el.click(); finger.classList.remove('press'); await w(380);
}
async function type(sel, text){
  const el=await moveTo(sel); el.focus({preventScroll:true});
  for(const ch of text){ el.value+=ch; el.dispatchEvent(new Event('input',{bubbles:true})); await w(260); }
}
async function dragChart(fromIdx, toIdx){
  const svg=await moveTo('#chart svg'); const r=svg.getBoundingClientRect(); const toX=i=>r.left+GEOM.x(i)*(r.width/GEOM.W);
  const yy=r.top+GEOM.padT+GEOM.plotH*0.55*(r.height/GEOM.H);
  placeFinger(toX(fromIdx), yy); await w(620);
  finger.classList.add('press','hold'); await w(320); scrubToClientX(toX(fromIdx));
  const steps=48; for(let k=1;k<=steps;k++){ const i=fromIdx+(toIdx-fromIdx)*k/steps; placeFinger(toX(i),yy,true); scrubToClientX(toX(i)); await w(38); }
  await w(900); finger.classList.remove('press','hold','drag'); clearScrub(); await w(300);
}
async function slideTime(to){
  const s=$('#timeSlider'); await moveTo(s); const r=s.getBoundingClientRect(); const xAt=v=>r.left+10+(r.width-20)*v/750, yy=r.top+r.height/2;
  placeFinger(xAt(state.nowMin),yy); await w(450); finger.classList.add('press');
  const from=state.nowMin, steps=Math.max(12,Math.round(Math.abs(to-from)/12));
  for(let k=1;k<=steps;k++){ const v=Math.round(from+(to-from)*k/steps); s.value=v; s.dispatchEvent(new Event('input',{bubbles:true})); placeFinger(xAt(v),yy,true); await w(34); }
  finger.classList.remove('press','drag'); await w(300);
}
let capIdx=0, capTotal=0;
function caption(text){ capIdx++; cap.hidden=false; cap.innerHTML=`<i>${capIdx}/${capTotal}</i><span>${text}</span><div class="bar"><u style="width:${capIdx/capTotal*100}%"></u></div>`; }
const SCRIPT = [
  ['반도체 그룹 4종목을 오늘 등락률로 한 차트에 비교하고 있어요. 차트 아래 막대는 종목별 거래 가능 시간이에요.', async()=>{ await moveTo('#chart svg'); await w(2200); }],
  ['차트를 길게 눌러 끌면 그 시각 값으로 리더보드가 바뀌어요. 끄는 동안 순서는 고정돼요.', async()=>{ await dragChart(75, 420); }],
  ['시각을 08:20으로 옮겨 볼게요. 프리마켓엔 NXT만 열려서 NXT 미지원 종목은 거래 불가예요.', async()=>{ await slideTime(20); await moveTo('[data-demo="status-chip"]'); await w(2200); }],
  ['16:30. KRX 애프터마켓이 열려 있으니 자동 모드는 다시 KRX를 써요 — KRX 우선.', async()=>{ await slideTime(510); await moveTo('[data-demo="status-chip"]'); await w(2000); await slideTime(582); }],
  ['NXT 모드로 바꾸면 NXT에서 거래되지 않는 종목은 KRX로 대체되고 배지가 붙어요.', async()=>{ await tap('[data-demo="venue-NXT"]'); await moveTo('[data-demo="row-042700"]'); await w(2000); await tap('[data-demo="venue-AUTO"]'); }],
  ['기간을 2주로 바꾸면 일봉으로 보여주고, 봉이 적어서 점을 함께 찍어요. 거래정지일은 사선 띠예요.', async()=>{ await tap('[data-demo="period-W"]'); await tap('[data-demo="count-2"]'); await moveTo('#chart svg'); await w(2400); }],
  ['3개월도 볼게요. 휴장일은 축에서 빠져요.', async()=>{ await tap('[data-demo="period-M"]'); await tap('[data-demo="count-3"]'); await w(1800); await tap('[data-demo="period-D"]'); }],
  ['비교 지표를 고점 대비 하락률로 바꿔요. 지금 쓸 수 없는 지표는 이유와 함께 비활성이에요.', async()=>{ await tap('[data-demo="metric-chip"]'); await w(900); await tap('[data-demo="metric-drawdown"]'); await w(2200); await tap('[data-demo="metric-chip"]'); await tap('[data-demo="metric-change"]'); }],
  ['초성으로 종목을 찾아 추가해요. ㅅㅅㅈㄱ → 삼성전기', async()=>{ await tap('[data-demo="add-btn"]'); await type('[data-demo="search"]','ㅅㅅㅈㄱ'); await w(700); await tap('[data-demo="add-009150"]'); await w(700); await tap('[data-demo="sheet-done"]'); await w(1200); }],
  ['색 점을 누르면 차트에서 잠깐 숨겨요. 다시 누르면 돌아와요.', async()=>{ await tap('[data-demo="dot-000660"]'); await w(1400); await tap('[data-demo="dot-000660"]'); }],
  ['종목을 누르면 KRX·NXT 가격과 오늘 거래 시간이 보여요. 삭제해도 되돌릴 수 있어요.', async()=>{ await tap('[data-demo="row-009150"]'); await w(2000); await tap('[data-demo="detail-delete"]'); await w(900); await tap('[data-demo="snack-undo"]'); await w(1000); if(state.sheet) await tap('[data-demo="sheet-close"]'); }],
  ['토스증권을 고르면 통합 시세만 있어서 KRX·NXT를 고를 수 없어요.', async()=>{ await tap('[data-demo="settings"]'); await tap('[data-demo="provider-toss"]'); await tap('[data-demo="sheet-close"]'); await moveTo('[data-demo="venue-KRX"]'); await w(2000); await tap('[data-demo="settings"]'); await tap('[data-demo="provider-kis"]'); await tap('[data-demo="sheet-close"]'); }],
  ['이제 직접 눌러 보세요. 아래 시각 슬라이더와 ⋯ 버튼으로 날짜·공급자·테마도 바꿀 수 있어요.', async()=>{ await moveTo('#timeSlider'); await w(2600); }],
];
async function runDemo(){
  demo.running=true; const my=++demo.token; capIdx=0; capTotal=SCRIPT.length;
  const theme=state.theme, conv=state.conv;
  closeSheet(); $('#dockPanel').hidden=true; state=initialState(); state.theme=theme; state.conv=conv; render(); scrollTo({top:0,behavior:'smooth'});
  $('#playBtn').textContent='■ 데모 정지'; $('#playBtn').classList.add('stop');
  finger.classList.add('show'); placeFinger(innerWidth/2, innerHeight*0.6);
  let completed=false;
  try{ for(const [text,fn] of SCRIPT){ if(my!==demo.token) break; caption(text); await fn(); await w(300); } completed = my===demo.token; }
  catch(err){ if(err.message!=='stopped') console.warn(err); }
  finally{ if(my===demo.token) stopDemo(); }
  if(completed && window.GAZUA_MOTION) setTimeout(()=>{ if(!demo.running) runDemo(); }, 2500); // 모션 모드: 끝까지 재생되면 반복
}
function stopDemo(){ demo.running=false; demo.token++; finger.classList.remove('show','press','hold','drag'); cap.hidden=true; $('#playBtn').textContent='▶ 데모 재생'; $('#playBtn').classList.remove('stop'); clearScrub(); }
$('#playBtn').addEventListener('click', ()=> demo.running ? stopDemo() : runDemo());
window.addEventListener('pointerdown', e=>{ if(demo.running && e.isTrusted && !e.target.closest('[data-demo-ctl]')){ stopDemo(); snack('데모를 멈췄어요. 직접 조작해 보세요'); } }, true);

render();
if(window.GAZUA_MOTION || new URLSearchParams(location.search).has('demo')) setTimeout(runDemo, 600);
</script>
